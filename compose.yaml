services:
  berkeley:
    build: .
    init: true
    ports:
      - "127.0.0.1:${BERKELEY_PORT:-8000}:8000"
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/state', timeout=8)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s
